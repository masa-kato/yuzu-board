<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The Mac runs app.py, which serves the app on port 5050. Phones, tablets and laptops on the same Wi-Fi open http://the-Mac's-IP:5050. The database and hold photos stay on the Mac.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#FFE14D"/>
    </marker>
  </defs>
  <rect width="960" height="284" rx="18" fill="#0f1512"/>

  <!-- the Mac -->
  <rect x="28" y="40" width="300" height="210" rx="14" fill="#111d17" stroke="#384c42" stroke-width="1.5"/>
  <rect x="48" y="62" width="64" height="42" rx="5" fill="#132d25" stroke="#9cb2a4" stroke-width="1.6"/>
  <path d="M40 110h80l-6 6h-68z" fill="#9cb2a4"/>
  <text x="134" y="80" font-size="17" font-weight="700" fill="#f0f6ef">Your Mac</text>
  <text x="134" y="101" font-size="13" fill="#9cb2a4">the server</text>
  <rect x="48" y="134" width="260" height="30" rx="7" fill="#1a2a23"/>
  <text x="60" y="154" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f6cd45">.venv/bin/python app.py</text>
  <text x="48" y="188" font-size="13" fill="#cddacf">Flask, listening on all networks</text>
  <text x="48" y="207" font-size="13" fill="#cddacf">at port <tspan font-weight="700" fill="#f0f6ef">5050</tspan></text>
  <text x="48" y="232" font-size="12.5" fill="#9cb2a4">Data stays here: homewall.db + uploads/</text>

  <!-- Wi-Fi -->
  <line x1="332" y1="145" x2="440" y2="145" stroke="#FFE14D" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <g transform="translate(486 128)" fill="none" stroke="#f0f6ef" stroke-width="3" stroke-linecap="round">
    <path d="M-30 -6a44 44 0 0 1 60 0"/>
    <path d="M-19 5a28 28 0 0 1 38 0"/>
    <path d="M-8 16a12 12 0 0 1 16 0"/>
    <circle cx="0" cy="25" r="2.5" fill="#f0f6ef"/>
  </g>
  <text x="486" y="186" font-size="15" font-weight="700" fill="#f0f6ef" text-anchor="middle">Same Wi-Fi</text>
  <text x="486" y="205" font-size="12.5" fill="#9cb2a4" text-anchor="middle">home network only</text>
  <line x1="532" y1="145" x2="606" y2="145" stroke="#FFE14D" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- devices -->
  <rect x="612" y="40" width="320" height="210" rx="14" fill="#111d17" stroke="#384c42" stroke-width="1.5"/>
  <g fill="#132d25" stroke="#9cb2a4" stroke-width="1.6">
    <rect x="634" y="60" width="26" height="46" rx="5"/>
    <rect x="672" y="64" width="44" height="42" rx="5"/>
    <rect x="730" y="66" width="52" height="32" rx="4"/>
  </g>
  <path d="M724 102h64l-5 5h-54z" fill="#9cb2a4"/>
  <text x="634" y="134" font-size="17" font-weight="700" fill="#f0f6ef">Phones, tablets, laptops</text>
  <text x="634" y="158" font-size="13" fill="#cddacf">Open in any browser:</text>
  <rect x="634" y="168" width="278" height="30" rx="7" fill="#1a2a23"/>
  <text x="646" y="188" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f6cd45">http://&lt;Mac's IP&gt;:5050</text>
  <text x="634" y="222" font-size="12.5" fill="#9cb2a4">On the Mac itself: http://localhost:5050</text>
  <text x="634" y="240" font-size="12.5" fill="#9cb2a4">No passwords: anyone on the Wi-Fi can use it.</text>
</svg>
