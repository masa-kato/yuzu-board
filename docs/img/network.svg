<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="The Raspberry Pi runs the live app on port 80 and keeps the database and hold photos. Phones, tablets and laptops on the same Wi-Fi open http://yuzuberrypi.local. The Mac copies the Pi's data every 15 minutes and runs a test app on port 5051.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#FFE14D"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9cb2a4"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="18" fill="#0f1512"/>

  <!-- the Pi -->
  <rect x="28" y="40" width="300" height="230" rx="14" fill="#111d17" stroke="#384c42" stroke-width="1.5"/>
  <rect x="48" y="62" width="64" height="44" rx="6" fill="#132d25" stroke="#9cb2a4" stroke-width="1.6"/>
  <g fill="#9cb2a4">
    <rect x="56" y="70" width="18" height="14" rx="2"/>
    <rect x="80" y="70" width="8" height="8" rx="1"/>
    <rect x="92" y="70" width="12" height="8" rx="1"/>
    <rect x="80" y="84" width="24" height="3" rx="1"/>
    <circle cx="56" cy="99" r="2"/><circle cx="64" cy="99" r="2"/><circle cx="72" cy="99" r="2"/><circle cx="80" cy="99" r="2"/><circle cx="88" cy="99" r="2"/><circle cx="96" cy="99" r="2"/><circle cx="104" cy="99" r="2"/>
  </g>
  <text x="134" y="80" font-size="17" font-weight="700" fill="#f0f6ef">Raspberry Pi</text>
  <text x="134" y="101" font-size="13" fill="#9cb2a4">the live app</text>
  <rect x="48" y="128" width="260" height="30" rx="7" fill="#1a2a23"/>
  <text x="60" y="148" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f6cd45">waitress-serve wsgi:app</text>
  <text x="48" y="182" font-size="13" fill="#cddacf">On every network, at port <tspan font-weight="700" fill="#f0f6ef">80</tspan></text>
  <text x="48" y="201" font-size="13" fill="#cddacf">Takes each new version from GitHub</text>
  <text x="48" y="232" font-size="12.5" fill="#9cb2a4">The data lives here: homewall.db + uploads/,</text>
  <text x="48" y="250" font-size="12.5" fill="#9cb2a4">with a snapshot every 15 minutes</text>

  <!-- Wi-Fi -->
  <line x1="332" y1="150" x2="440" y2="150" stroke="#FFE14D" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <g transform="translate(486 133)" fill="none" stroke="#f0f6ef" stroke-width="3" stroke-linecap="round">
    <path d="M-30 -6a44 44 0 0 1 60 0"/>
    <path d="M-19 5a28 28 0 0 1 38 0"/>
    <path d="M-8 16a12 12 0 0 1 16 0"/>
    <circle cx="0" cy="25" r="2.5" fill="#f0f6ef"/>
  </g>
  <text x="486" y="191" font-size="15" font-weight="700" fill="#f0f6ef" text-anchor="middle">Same Wi-Fi</text>
  <text x="486" y="210" font-size="12.5" fill="#9cb2a4" text-anchor="middle">home network only</text>
  <line x1="532" y1="150" x2="606" y2="150" stroke="#FFE14D" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>

  <!-- devices -->
  <rect x="612" y="40" width="320" height="230" rx="14" fill="#111d17" stroke="#384c42" stroke-width="1.5"/>
  <g fill="#132d25" stroke="#9cb2a4" stroke-width="1.6">
    <rect x="634" y="60" width="26" height="46" rx="5"/>
    <rect x="672" y="64" width="44" height="42" rx="5"/>
    <rect x="730" y="66" width="52" height="32" rx="4"/>
  </g>
  <path d="M724 102h64l-5 5h-54z" fill="#9cb2a4"/>
  <text x="634" y="136" font-size="17" font-weight="700" fill="#f0f6ef">Phones, tablets, laptops</text>
  <text x="634" y="160" font-size="13" fill="#cddacf">Open in any browser:</text>
  <rect x="634" y="170" width="278" height="30" rx="7" fill="#1a2a23"/>
  <text x="646" y="190" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f6cd45">http://yuzuberrypi.local</text>
  <text x="634" y="226" font-size="12.5" fill="#9cb2a4">Anyone on the Wi-Fi can use it;</text>
  <text x="634" y="244" font-size="12.5" fill="#9cb2a4">only the admin needs a password.</text>

  <!-- the Mac -->
  <line x1="178" y1="276" x2="178" y2="334" stroke="#9cb2a4" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#b)"/>
  <text x="192" y="300" font-size="12.5" fill="#9cb2a4">a copy of the data,</text>
  <text x="192" y="317" font-size="12.5" fill="#9cb2a4">every 15 minutes</text>
  <rect x="28" y="340" width="904" height="102" rx="14" fill="#111d17" stroke="#384c42" stroke-width="1.5"/>
  <rect x="48" y="360" width="64" height="42" rx="5" fill="#132d25" stroke="#9cb2a4" stroke-width="1.6"/>
  <path d="M40 408h80l-6 6h-68z" fill="#9cb2a4"/>
  <text x="134" y="378" font-size="17" font-weight="700" fill="#f0f6ef">Your Mac</text>
  <text x="134" y="399" font-size="13" fill="#9cb2a4">where the code is changed</text>
  <text x="134" y="424" font-size="12.5" fill="#9cb2a4">Keeps the copy, to fall back on if the Pi fails</text>
  <rect x="520" y="362" width="392" height="30" rx="7" fill="#1a2a23"/>
  <text x="532" y="382" font-size="13.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#f6cd45">deploy/mac/test-app.sh</text>
  <text x="520" y="414" font-size="13" fill="#cddacf">The test app, on a copy of the data, at port <tspan font-weight="700" fill="#f0f6ef">5051</tspan></text>
  <text x="520" y="432" font-size="12.5" fill="#9cb2a4">Push to GitHub, and the Pi has it in about 2 minutes</text>
</svg>
