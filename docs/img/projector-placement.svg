<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Left, side view: a 45 degree board with an 8 inch kicker; a short-throw projector hangs upside down on the side wall about 13 to 15 feet out from the wall base and 6 to 7 feet up, nose tilted up about 25 to 30 degrees, and its light reaches from the kicker to the top of the wall. Right, from above: one projector on each side wall of a 13 foot wide room; a climber's body casts two shadows on the wall, offset to either side, so each is still lit by the other projector and only a small patch behind the torso is dark.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9cb2a4"/>
    </marker>
  </defs>
  <rect width="1000" height="470" rx="18" fill="#0f1512"/>

  <!-- ===== side view ===== -->
  <rect x="20" y="20" width="490" height="430" rx="14" fill="#111d17" stroke="#384c42" stroke-width="1.5"/>
  <text x="40" y="50" font-size="17" font-weight="700" fill="#f0f6ef">Side view</text>
  <text x="40" y="70" font-size="12.5" fill="#9cb2a4">45° board; the other projector mirrors this on the far side wall</text>

  <!-- room: back wall, ceiling, floor -->
  <line x1="50" y1="128" x2="50" y2="380" stroke="#384c42" stroke-width="2"/>
  <line x1="50" y1="128" x2="484" y2="128" stroke="#384c42" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="300" y="120" font-size="11.5" fill="#9cb2a4">room ceiling ≈ 9 ft</text>
  <line x1="50" y1="380" x2="484" y2="380" stroke="#9cb2a4" stroke-width="2"/>

  <!-- mat -->
  <rect x="50" y="352" width="280" height="28" rx="3" fill="#1a2a23"/>
  <text x="300" y="371" font-size="11.5" fill="#9cb2a4" text-anchor="middle">mat</text>

  <!-- projector light: from the lens to the kicker and the top of the wall -->
  <polygon points="428,191 246,163 50,380" fill="#FFE14D" fill-opacity="0.10"/>
  <line x1="428" y1="191" x2="246" y2="163" stroke="#FFE14D" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="428" y1="191" x2="50" y2="380" stroke="#FFE14D" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- the wall: kicker, 45° main panel, ceiling panel -->
  <line x1="50" y1="380" x2="50" y2="359" stroke="#f0f6ef" stroke-width="6" stroke-linecap="round"/>
  <line x1="50" y1="359" x2="246" y2="163" stroke="#f0f6ef" stroke-width="6" stroke-linecap="round"/>
  <line x1="246" y1="163" x2="285" y2="148" stroke="#f0f6ef" stroke-width="4" stroke-dasharray="4 4"/>
  <text x="58" y="398" font-size="11.5" fill="#9cb2a4">kicker</text>
  <text x="128" y="262" font-size="13" font-weight="700" fill="#f0f6ef" transform="rotate(-45 128 262)">45° main panel</text>
  <text x="262" y="186" font-size="11" fill="#9cb2a4">ceiling panel</text>
  <text x="262" y="200" font-size="11" fill="#9cb2a4">(angle not modelled)</text>

  <!-- climber hanging under the wall -->
  <g stroke="#9cb2a4" stroke-linecap="round" fill="none">
    <line x1="135" y1="318" x2="175" y2="278" stroke-width="16"/>
    <line x1="175" y1="278" x2="182" y2="234" stroke-width="5"/>
    <line x1="135" y1="318" x2="133" y2="339" stroke-width="7"/>
    <line x1="133" y1="339" x2="92" y2="322" stroke-width="5"/>
  </g>
  <circle cx="188" cy="268" r="8" fill="#9cb2a4"/>

  <!-- projector, upside down, nose up -->
  <g transform="translate(442 198) rotate(27)">
    <rect x="-18" y="-10" width="36" height="20" rx="4" fill="#132d25" stroke="#FFE14D" stroke-width="1.6"/>
    <circle cx="-12" cy="4" r="4.5" fill="#FFE14D"/>
  </g>
  <text x="500" y="236" font-size="12" fill="#f0f6ef" text-anchor="end">projector, upside down</text>
  <text x="500" y="252" font-size="12" fill="#9cb2a4" text-anchor="end">nose up ≈ 25–30°</text>

  <!-- dimensions -->
  <line x1="466" y1="378" x2="466" y2="212" stroke="#9cb2a4" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="458" y="300" font-size="12" fill="#cddacf" text-anchor="end">≈ 6–7 ft up</text>
  <line x1="52" y1="414" x2="440" y2="414" stroke="#9cb2a4" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="246" y="436" font-size="12.5" fill="#cddacf" text-anchor="middle">≈ 13–15 ft out from the wall base</text>

  <!-- ===== top view ===== -->
  <rect x="530" y="20" width="450" height="430" rx="14" fill="#111d17" stroke="#384c42" stroke-width="1.5"/>
  <text x="550" y="50" font-size="17" font-weight="700" fill="#f0f6ef">From above (schematic)</text>
  <text x="550" y="70" font-size="12.5" fill="#9cb2a4">both projectors light the whole wall</text>

  <!-- side walls -->
  <line x1="560" y1="104" x2="560" y2="420" stroke="#384c42" stroke-width="2"/>
  <line x1="900" y1="104" x2="900" y2="420" stroke="#384c42" stroke-width="2"/>
  <text x="566" y="410" font-size="11" fill="#9cb2a4">side wall</text>
  <text x="894" y="410" font-size="11" fill="#9cb2a4" text-anchor="end">side wall</text>

  <!-- light from each projector to the wall's ends -->
  <g stroke="#FFE14D" stroke-width="1" stroke-opacity="0.35">
    <line x1="608" y1="392" x2="580.5" y2="110"/>
    <line x1="608" y1="392" x2="879.5" y2="110"/>
    <line x1="852" y1="392" x2="580.5" y2="110"/>
    <line x1="852" y1="392" x2="879.5" y2="110"/>
  </g>

  <!-- shadows of the body from each projector -->
  <polygon points="713,140 747,140 763.5,110 725.5,110" fill="#000000" fill-opacity="0.45"/>
  <polygon points="713,140 747,140 734.5,110 696.5,110" fill="#000000" fill-opacity="0.45"/>

  <!-- the wall, coloured by how it's lit -->
  <line x1="580.5" y1="110" x2="696.5" y2="110" stroke="#FFE14D" stroke-width="6"/>
  <line x1="763.5" y1="110" x2="879.5" y2="110" stroke="#FFE14D" stroke-width="6"/>
  <line x1="696.5" y1="110" x2="725.5" y2="110" stroke="#FFE14D" stroke-opacity="0.45" stroke-width="6"/>
  <line x1="734.5" y1="110" x2="763.5" y2="110" stroke="#FFE14D" stroke-opacity="0.45" stroke-width="6"/>
  <line x1="725.5" y1="110" x2="734.5" y2="110" stroke="#0f1512" stroke-width="6"/>
  <text x="586" y="130" font-size="11.5" fill="#f0f6ef">lit by both</text>
  <text x="874" y="130" font-size="11.5" fill="#f0f6ef" text-anchor="end">lit by both</text>
  <text x="706" y="98" font-size="11" fill="#cddacf" text-anchor="end">lit by left only</text>
  <text x="754" y="98" font-size="11" fill="#cddacf">lit by right only</text>
  <text x="730" y="84" font-size="11" fill="#f0f6ef" text-anchor="middle">dark</text>
  <line x1="730" y1="88" x2="730" y2="105" stroke="#f0f6ef" stroke-width="1"/>

  <!-- climber -->
  <ellipse cx="730" cy="140" rx="17" ry="11" fill="#9cb2a4"/>
  <text x="756" y="152" font-size="11.5" fill="#9cb2a4">climber</text>

  <!-- projectors -->
  <rect x="592" y="384" width="32" height="18" rx="4" fill="#132d25" stroke="#FFE14D" stroke-width="1.6"/>
  <rect x="836" y="384" width="32" height="18" rx="4" fill="#132d25" stroke="#FFE14D" stroke-width="1.6"/>
  <text x="608" y="378" font-size="12" fill="#f0f6ef" text-anchor="middle">left</text>
  <text x="852" y="378" font-size="12" fill="#f0f6ef" text-anchor="middle">right</text>

  <!-- room width -->
  <line x1="562" y1="436" x2="898" y2="436" stroke="#9cb2a4" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="690" y="428" width="80" height="16" fill="#111d17"/>
  <text x="730" y="440" font-size="12" fill="#cddacf" text-anchor="middle">≈ 13 ft room</text>

  <text x="755" y="250" font-size="12" fill="#cddacf" text-anchor="middle">Where one projector is blocked,</text>
  <text x="755" y="266" font-size="12" fill="#cddacf" text-anchor="middle">the other still lights the wall</text>
  <text x="755" y="282" font-size="12" fill="#cddacf" text-anchor="middle">at half brightness.</text>
</svg>
